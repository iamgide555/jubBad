services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: always
    env_file: ./server/.env
    user: "${PUID}:${PGID}"
    volumes:
      # The whole directory, not just dev.db: WAL mode (PrismaService
      # .onModuleInit) writes dev.db-wal and dev.db-shm alongside the
      # database, and mounting only the file leaves those two in the
      # container's ephemeral layer — a restart before a checkpoint then
      # loses committed writes. The directory also carries schema.prisma and
      # migrations/, which `prisma migrate deploy` reads at startup.
      - ./server/prisma:/app/prisma
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: always
    depends_on:
      - api
    expose:
      - "80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    depends_on:
      - web
    user: "${PUID}:${PGID}"
    command: tunnel --config /etc/cloudflared/jubbad.yml run
    volumes:
      - ~/.cloudflared:/etc/cloudflared:ro
