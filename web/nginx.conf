server {
    listen 80;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Docker's embedded DNS resolver — lets nginx re-resolve "api" lazily
    # per-request instead of once at config load. Without this, nginx
    # refuses to start at all if the api container isn't up yet (or isn't
    # reachable, e.g. standalone testing), since a bare `proxy_pass
    # http://api:3000/` resolves eagerly at boot.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $upstream_api api:3000;
        # proxy_pass with a variable target can't do its usual automatic
        # prefix-stripping (nginx can't determine what part of the URI
        # matched the location when the target is a variable) - it would
        # silently forward every request as bare "/", dropping everything
        # after /api/. Strip the prefix explicitly instead.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
