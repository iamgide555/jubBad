<div class="page reset-password">
  @if (done()) {
    <h1 i18n="@@resetPassword.doneTitle">ตั้งรหัสผ่านใหม่แล้ว</h1>
    <p class="lede" i18n="@@resetPassword.doneLede">เข้าสู่ระบบด้วยรหัสผ่านใหม่ได้เลย</p>
    <button type="button" (click)="goToLogin()" i18n="@@resetPassword.goToLogin">
      ไปหน้าเข้าสู่ระบบ
    </button>
  } @else {
    <h1 i18n="@@resetPassword.title">ตั้งรหัสผ่านใหม่</h1>
    <p class="lede" i18n="@@resetPassword.lede">กรอกรหัสผ่านใหม่สำหรับบัญชีของคุณ</p>

    <form (ngSubmit)="submit()">
      <label for="password" i18n="@@resetPassword.passwordLabel">รหัสผ่านใหม่</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="new-password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        [attr.aria-invalid]="error() ? 'true' : null"
        [attr.aria-describedby]="error() ? 'reset-error' : null"
      />

      <label for="confirmPassword" i18n="@@resetPassword.confirmLabel">ยืนยันรหัสผ่านใหม่</label>
      <input
        id="confirmPassword"
        name="confirmPassword"
        type="password"
        autocomplete="new-password"
        [ngModel]="confirmPassword()"
        (ngModelChange)="confirmPassword.set($event)"
        [attr.aria-invalid]="error() ? 'true' : null"
        [attr.aria-describedby]="error() ? 'reset-error' : null"
      />

      @if (error()) {
        <p class="error" id="reset-error" role="alert">{{ error() }}</p>
      }

      <button type="submit" [disabled]="!canSubmit()">
        @if (busy()) {
          <ng-container i18n="@@resetPassword.submitting">กำลังบันทึก…</ng-container>
        } @else {
          <ng-container i18n="@@resetPassword.submit">ตั้งรหัสผ่านใหม่</ng-container>
        }
      </button>
    </form>
  }
</div>
