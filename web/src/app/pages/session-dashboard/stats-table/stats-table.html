<div class="stats-table">
  <div class="scope-toggle">
    <button type="button" [class.active]="scope() === 'session'" (click)="setScope('session')" i18n="@@stats.thisSession">
      ก๊วนนี้
    </button>
    <button type="button" [class.active]="scope() === 'all'" (click)="setScope('all')" i18n="@@stats.allTime">
      ทั้งหมด
    </button>
  </div>
  <table>
    <thead>
      <tr>
        <th i18n="@@stats.player">ผู้เล่น</th>
        <th i18n="@@stats.played">เล่น</th>
        <th i18n="@@stats.won">ชนะ</th>
      </tr>
    </thead>
    <tbody>
      @for (row of stats(); track row.playerId) {
        <tr>
          <td>{{ row.name }}</td>
          <td>{{ row.played }}</td>
          <td>{{ row.won }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
