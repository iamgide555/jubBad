<h1>{{ header() }}</h1>

<div class="courts">
  @for (line of courtLines(); track line.courtNumber) {
    <div class="court-line">
      <h2>COURT {{ line.courtNumber }}</h2>
      <p>{{ line.text }}</p>
    </div>
  }
</div>

<p class="waiting-queue">รอคิว: {{ waitingNames().join(', ') }}</p>

<button type="button" (click)="refresh()">↻ refresh</button>
