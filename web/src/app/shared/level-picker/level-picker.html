<ng-template #panel>
  <div class="chips">
    <button
      type="button"
      class="chip"
      [class.selected]="level() === null"
      (click)="choose(null)"
      aria-label="ไม่ระบุ"
      i18n-aria-label="@@level.unset"
    >
      -
    </button>
    @for (l of levels; track l) {
      <button type="button" class="chip" [class.selected]="level() === l" (click)="choose(l)">
        {{ l }}
      </button>
    }
  </div>

  @if (currentDefinition(); as def) {
    <p class="definition">{{ def }}</p>
  }

  <p class="hint" i18n="@@level.uncertainHint">
    ไม่แน่ใจ เลือกใกล้เคียงไว้ก่อน ผลแพ้ชนะจะปรับเรตติ้งเอง
  </p>
</ng-template>

@if (compact()) {
  <button type="button" class="level-trigger" (click)="open()">
    {{ level() ?? unsetLabel }}
  </button>
  <dialog #dialog class="level-dialog">
    <div class="level-panel">
      <ng-container [ngTemplateOutlet]="panel" />
      <button type="button" class="ghost" (click)="close()" i18n="@@level.close">ปิด</button>
    </div>
  </dialog>
} @else {
  <div class="level-panel">
    <ng-container [ngTemplateOutlet]="panel" />
  </div>
}
