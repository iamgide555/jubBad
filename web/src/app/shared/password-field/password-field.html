<div class="password-field">
  <div class="password-row">
    <input
      #field
      [id]="fieldId()"
      [name]="fieldId()"
      [type]="shown() ? 'text' : 'password'"
      [attr.autocomplete]="autocomplete()"
      [attr.minlength]="minLength()"
      maxlength="512"
      [value]="value()"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      [attr.aria-describedby]="describedIds()"
      (input)="onInput($event)"
    />
    <button
      type="button"
      class="ghost toggle"
      data-show-password
      [attr.aria-pressed]="shown()"
      (click)="shown.set(!shown())"
    >
      @if (shown()) {
        <ng-container i18n="@@password.hide">ซ่อน</ng-container>
      } @else {
        <ng-container i18n="@@password.show">แสดง</ng-container>
      }
    </button>
  </div>
  @if (hint(); as text) {
    <p class="muted hint" data-password-hint [class.invalid]="invalid()" [id]="hintId()">{{ text }}</p>
  }
</div>
